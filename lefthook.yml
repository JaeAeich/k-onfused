pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,js,json,md,yml,yaml,css}'
      run: npx prettier --check {staged_files}
    eslint:
      glob: '*.{ts,js}'
      run: npx eslint {staged_files}
    markdownlint:
      glob: '*.md'
      exclude: 'results/*/README.md'
      run: npx markdownlint-cli2 {staged_files}
    typecheck:
      glob: '*.ts'
      run: npm run -s typecheck

pre-push:
  commands:
    test:
      run: npm test
