services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - '6006:6006'
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data
volumes:
  qdrant_data:
  phoenix_data:
